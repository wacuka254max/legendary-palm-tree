<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Analysis | Evie</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#f3f4f7" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<script>
/* Applied before paint: a saved dark choice must not flash a light page first.
   Light is the default when nothing has been chosen. */
(function(){try{var t=localStorage.getItem("evie_theme");
document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");}catch(e){}})();
</script>
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/analysis/analysis.css" />
</head>
<body class="dash">

<header class="nav">
  <div class="bleed nav-inner">
    <a class="brand" href="/home.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="8" fill="#ff3d87"/><path d="M11 10h10M11 16h7M11 22h10" stroke="#0b0b0f" stroke-width="2.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">Evie</span>
    </a>
    <div class="perch">
      <button class="btn btn-line theme-b" data-theme-toggle type="button" aria-pressed="false" title="Switch to dark">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span data-theme-label>Dark</span>
      </button>
      <span class="perch-v" id="balance">—</span>
      <span class="badge" id="acct-badge">Real</span>
      <a class="btn btn-line" href="/home.html">Home</a>
    </div>
  </div>
</header>

<main class="bleed dash-main">

  <!-- ── settings ─────────────────────────────────────────────────────── -->
  <section class="tools">
    <div class="tools-head">
      <h1 class="tools-t">Market analysis tools</h1>
    </div>

    <div class="tools-grid">
      <label class="fld">
        <span class="fld-k">Account</span>
        <select class="fld-i" id="account"></select>
      </label>
      <label class="fld">
        <span class="fld-k">Stake (USD)</span>
        <input class="fld-i" id="stake" type="number" min="0.35" step="0.01" value="1" inputmode="decimal" />
      </label>
      <label class="fld">
        <span class="fld-k">Reference digit</span>
        <input class="fld-i" id="ref" type="number" min="0" max="9" step="1" value="5" inputmode="numeric" />
      </label>
      <label class="fld">
        <span class="fld-k">Analysis count</span>
        <input class="fld-i" id="count" type="number" min="10" max="5000" step="10" value="130" inputmode="numeric" />
      </label>

      <div class="fld fld--mart">
        <span class="fld-k">
          Martingale
          <button class="tog" id="mart-tog" type="button" role="switch" aria-checked="true" aria-label="Martingale">
            <span class="tog-dot"></span>
          </button>
        </span>
        <input class="fld-i" id="mart" type="number" min="1" step="0.1" value="3.1" inputmode="decimal" />
      </div>
    </div>

    <div class="syms">
      <span class="fld-k">Active symbols <span class="fld-hint">select a symbol to see its analysis</span></span>
      <div class="syms-row" id="syms"></div>
    </div>

    <p class="tools-foot">
      <span class="risk" id="risk"></span>
      <span class="next-stake" id="next-stake"></span>
    </p>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <!-- ── one card per active symbol ───────────────────────────────────── -->
  <section class="cards-grid" id="cards"></section>

</main>

<!-- ── transactions ─────────────────────────────────────────────────────
     A rail down the right on a wide screen; on a narrow one the same markup
     becomes a sheet that rises from the bottom. -->
<aside class="txn" id="txn">
  <button class="txn-handle" data-handle type="button" aria-expanded="false" aria-controls="txn-body">
    <span class="txn-grip" aria-hidden="true"></span>
    <span class="txn-handle-t">Transactions <span class="txn-count" data-count></span></span>
    <svg class="txn-chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
  </button>

  <div class="txn-body" id="txn-body">
    <div class="txn-head">
      <span>Type</span>
      <span>Entry/Exit spot</span>
      <span class="txn-head-r">Buy price and P/L</span>
    </div>

    <ul class="txn-rows" data-rows><li class="tx-none">No transactions yet.</li></ul>

    <div class="sum">
      <div class="sum-c"><span class="sum-k">Total stake</span><span class="sum-v" data-stake>0.00 USD</span></div>
      <div class="sum-c"><span class="sum-k">Total payout</span><span class="sum-v" data-payout>0.00 USD</span></div>
      <div class="sum-c"><span class="sum-k">No. of runs</span><span class="sum-v" data-runs>0</span></div>
      <div class="sum-c"><span class="sum-k">Contracts lost</span><span class="sum-v" data-lost>0</span></div>
      <div class="sum-c"><span class="sum-k">Contracts won</span><span class="sum-v" data-won>0</span></div>
      <div class="sum-c"><span class="sum-k">Total profit/loss</span><span class="sum-v" data-pl>0.00 USD</span></div>
    </div>

    <button class="btn btn-line txn-reset" data-reset type="button">Reset</button>
  </div>
</aside>

<script src="/deriv.js"></script>
<script src="/analysis/contracts.js"></script>
<script src="/analysis/session.js"></script>
<script src="/analysis/analyser.js"></script>
<script src="/analysis/trader.js"></script>
<script src="/analysis/txn.js"></script>
<script src="/analysis/app.js"></script>
<script src="/theme.js"></script>
</body>
</html>
