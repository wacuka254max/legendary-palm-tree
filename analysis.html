<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Analysis | Evie</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0b0b0f" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/analysis/analysis.css" />
</head>
<body class="dash">

<header class="nav">
  <div class="bleed nav-inner">
    <a class="brand" href="/home.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="8" fill="#ff3d87"/><path d="M11 10h10M11 16h7M11 22h10" stroke="#0b0b0f" stroke-width="2.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">Evie</span>
    </a>
    <div class="perch">
      <span class="perch-v" id="balance">—</span>
      <span class="badge" id="acct-badge">Real</span>
      <a class="btn btn-line" href="/home.html">Home</a>
    </div>
  </div>
</header>

<main class="bleed dash-main">

  <!-- ── settings ─────────────────────────────────────────────────────── -->
  <section class="tools">
    <div class="tools-head">
      <h1 class="tools-t">Market analysis tools</h1>
      <button class="btn btn-blue" id="run" type="button">Start Analysis</button>
    </div>

    <div class="tools-grid">
      <label class="fld">
        <span class="fld-k">Account</span>
        <select class="fld-i" id="account"></select>
      </label>
      <label class="fld">
        <span class="fld-k">Stake amount (USD)</span>
        <input class="fld-i" id="stake" type="number" min="0.35" step="0.01" value="1" inputmode="decimal" />
      </label>
      <label class="fld">
        <span class="fld-k">Reference digit (0–9)</span>
        <input class="fld-i" id="ref" type="number" min="0" max="9" step="1" value="5" inputmode="numeric" />
      </label>
      <label class="fld">
        <span class="fld-k">Analysis count</span>
        <input class="fld-i" id="count" type="number" min="10" max="5000" step="10" value="130" inputmode="numeric" />
      </label>
      <div class="fld fld--btn">
        <button class="btn btn-line" id="apply" type="button">Apply settings</button>
      </div>
    </div>

    <p class="risk" id="risk"></p>

    <div class="syms">
      <span class="fld-k">Active symbols</span>
      <div class="syms-row" id="syms"></div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <!-- ── one card per active symbol ───────────────────────────────────── -->
  <section class="cards-grid" id="cards"></section>

  <!-- ── results ──────────────────────────────────────────────────────── -->
  <section class="panel-solid results">
    <h2 class="grp-t">Trade results <span class="grp-note" id="net"></span></h2>
    <ul class="hist" id="hist"><li class="acct acct--none">No trades yet. Place a trade to see results here.</li></ul>
  </section>

</main>

<script src="/deriv.js"></script>
<script src="/analysis/contracts.js"></script>
<script src="/analysis/session.js"></script>
<script src="/analysis/analyser.js"></script>
<script src="/analysis/trader.js"></script>
<script src="/analysis/app.js"></script>
</body>
</html>
