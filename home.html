<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Home | Evie</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0b0b0f" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="dash">

<header class="nav">
  <div class="bleed nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="8" fill="#ff3d87"/><path d="M11 10h10M11 16h7M11 22h10" stroke="#0b0b0f" stroke-width="2.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">Evie</span>
    </a>

    <!-- The real balance, top right. Nothing else: the demo account, the
         wallets and the per-account detail all live behind the badge. -->
    <div class="perch">
      <span class="perch-v" id="amount">Checking…</span>
      <button class="badge" id="badge" type="button"
              title="Double-click for full account details"
              aria-haspopup="dialog"
              aria-label="Real account. Double-click for full account details.">Real</button>
    </div>
  </div>
</header>

<main class="bleed dash-main">

  <div class="flash flash--ok" id="connected" hidden>
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 7"/></svg>
    <span>Deriv account connected</span>
  </div>

  <h1 class="dash-title">Home</h1>

  <div class="dash-grid">
   <div class="dash-col">

  <div class="tiles">
    <a class="tile" href="/analysis.html">
      <span class="tile-icon icon-blue" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      </span>
      <span class="tile-h"><span class="tile-t">Analysis</span><span class="tag-bot">Bots</span></span>
      <span class="tile-s">Read the market before you commit to it.</span>
    </a>

    <a class="tile" href="/automatic-ai.html">
      <span class="tile-icon icon-pink" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.5-6.5-2.1 2.1M8.6 15.4l-2.1 2.1m0-11.9 2.1 2.1m6.8 6.8 2.1 2.1"/><circle cx="12" cy="12" r="3.4"/></svg>
      </span>
      <span class="tile-h"><span class="tile-t">Automatic AI</span><span class="tag-bot">Bots</span></span>
      <span class="tile-s">Hand it the account and let it trade.</span>
    </a>
  </div>

  <a class="notice-go" href="https://home.deriv.com/dashboard/portfolio" target="_blank" rel="noopener noreferrer">
    Transfer funds to your options account
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
  </a>

   </div>

   <!-- Live volatility prices. On a wide screen this fills the space to the
        right of the tiles; below 1180px it drops under them. -->
   <aside class="markets is-open" id="markets">
     <button class="mk-head" id="mk-head" type="button" aria-expanded="true" aria-controls="mk-list">
       <span>Price changes (5 minutes)</span>
       <svg class="mk-chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
     </button>
     <ul class="mk-list" id="mk-list">
       <li class="mk mk--none">Waiting for prices…</li>
     </ul>
   </aside>

  </div>

</main>

<!-- Full account detail. Opened by double-clicking the Real badge. -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div>
        <p class="sheet-k">Account details</p>
        <h2 class="sheet-t" id="sheet-title">Your Deriv portfolio</h2>
      </div>
      <button class="sheet-x" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="sheet-body" id="sheet-body"></div>

    <div class="sheet-foot">
      <button class="btn btn-line" id="disconnect" type="button">Disconnect</button>
    </div>
  </div>
</div>

<script src="/deriv.js"></script>
<script src="/markets.js"></script>
<script src="/home.js"></script>
</body>
</html>
