<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Automatic AI | Evie</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#f3f4f7" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<script>
/* Applied before paint: a saved dark choice must not flash a light page first.
   Light is the default when nothing has been chosen. */
(function(){try{var t=localStorage.getItem("evie_theme");
document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");}catch(e){}})();
</script>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="dash">

<header class="nav">
  <div class="bleed nav-inner">
    <a class="brand" href="/home.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="8" fill="#ff3d87"/><path d="M11 10h10M11 16h7M11 22h10" stroke="#0b0b0f" stroke-width="2.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">Evie</span>
    </a>
    <div class="perch">
      <button class="btn btn-line theme-b" data-theme-toggle type="button" aria-pressed="false" title="Switch to dark">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span data-theme-label>Dark</span>
      </button>
      <span class="perch-v" id="balance">—</span>
      <span class="badge" id="acct-badge">Real</span>
      <a class="btn btn-line" href="/home.html">Home</a>
    </div>
  </div>
</header>

<main class="bleed dash-main">
  <h1 class="dash-title">Automatic AI</h1>

  <div class="run">

    <!-- ── controls ─────────────────────────────────────────────────── -->
    <section class="panel-solid">
      <h2 class="grp-t">Settings</h2>

      <label class="fld">
        <!-- Double-clicking the A reveals the demo accounts. Deliberately
             unadvertised: the demo is for testing a change, not something to
             be offered beside the real account every time. -->
        <span class="fld-k"><span class="acct-reveal" id="reveal" title="Account">A</span>ccount</span>
        <select class="fld-i" id="account"></select>
      </label>

      <div class="fld-row">
        <label class="fld">
          <span class="fld-k">Stake</span>
          <input class="fld-i" id="stake" type="number" min="0.35" step="0.01" value="1" inputmode="decimal" />
        </label>
        <label class="fld">
          <span class="fld-k">Martingale</span>
          <input class="fld-i" id="mart" type="number" min="1" step="0.1" value="3.1" inputmode="decimal" />
        </label>
      </div>

      <div class="fld-row">
        <label class="fld">
          <span class="fld-k">Take profit</span>
          <input class="fld-i" id="tp" type="number" min="0" step="1" value="100" inputmode="decimal" />
        </label>
        <label class="fld">
          <span class="fld-k">Stop loss</span>
          <input class="fld-i" id="sl" type="number" min="0" step="1" value="1000" inputmode="decimal" />
        </label>
      </div>

      <div class="run-actions">
        <button class="btn btn-blue btn-lg" id="start" type="button">Start</button>
        <button class="btn btn-line btn-lg" id="stop" type="button" disabled>Stop</button>
      </div>

      <p class="risk" id="risk"></p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <!-- ── live state ───────────────────────────────────────────────── -->
    <section class="panel-solid">
      <h2 class="grp-t">Session</h2>

      <dl class="stats-grid">
        <div><dt>Profit</dt><dd id="s-profit">0.00</dd></div>
        <div><dt>Trades</dt><dd id="s-trades">0</dd></div>
        <div><dt>Win rate</dt><dd id="s-rate">0.00%</dd></div>
        <div><dt>Next stake</dt><dd id="s-stake">—</dd></div>
        <div><dt>Market</dt><dd id="s-market">—</dd></div>
        <div><dt>Running</dt><dd id="s-time">00:00:00</dd></div>
      </dl>

      <h3 class="grp-t grp-t--sub">Trades</h3>
      <ul class="hist" id="hist"><li class="acct acct--none">No trades yet.</li></ul>
    </section>

  </div>
</main>

<script src="/deriv.js"></script>
<script src="/automatic-ai-engine.js"></script>
<script src="/automatic-ai.js"></script>
<script src="/theme.js"></script>
</body>
</html>
