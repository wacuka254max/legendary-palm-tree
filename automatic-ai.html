<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Uptick Auto Ai | Uptick</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#f7f7fb" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<script>
/* Applied before paint: a saved dark choice must not flash a light page
   first. Light is the default; dark is the option. */
(function(){try{var t=localStorage.getItem("uptick_theme");
document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="/site.css" />
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/ai.css" />
<link rel="stylesheet" href="/alert/alert.css" />
</head>
<body class="app">

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/home.html">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <circle cx="16" cy="16" r="16" fill="#7c5cff"/>
        <path d="M9 20.5 16 9l7 11.5-7-4.2-7 4.2z" fill="#fff"/>
      </svg>
      <span>Uptick</span>
    </a>

    <div class="perch">
      <button class="btn btn--icon" data-theme-toggle type="button" aria-pressed="true" title="Switch to light">
        <svg class="ico-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        <span data-theme-label class="vh">Light</span>
      </button>
      <span class="perch-v" id="balance">&mdash;</span>
      <span class="badge" id="acct-badge">Real</span>
      <a class="btn" href="/home.html">Home</a>
    </div>
  </div>
</header>

<main class="wrap dash-main">
  <!-- The "U" of Uptick is the handle for the account picker: three clicks
       and it appears in Settings. Hidden by default so this page runs the real
       account and only the real account. -->
  <h1 class="app-t page-t"><span class="acct-reveal" id="acct-key" title="Account">U</span>ptick Auto Ai</h1>

  <div class="run">

    <!-- ── controls ─────────────────────────────────────────────────── -->
    <section class="panel-solid">
      <h2 class="grp-t">Settings</h2>

      <label class="fld" id="acct-fld" hidden>
        <span class="fld-k">Account</span>
        <select class="fld-i" id="account"></select>
      </label>

      <!-- One to a line. Paired across a row they read as two halves of one
           setting, and stake beside martingale is exactly the pair you do not
           want misread. -->
      <label class="fld">
        <span class="fld-k">Stake</span>
        <input class="fld-i" id="stake" type="number" min="0.35" step="0.01" value="1" inputmode="decimal" />
      </label>
      <label class="fld">
        <span class="fld-k">Martingale</span>
        <input class="fld-i" id="mart" type="number" min="1" step="0.1" value="3.1" inputmode="decimal" />
      </label>
      <label class="fld">
        <span class="fld-k">Take profit</span>
        <input class="fld-i" id="tp" type="number" min="0" step="1" value="100" inputmode="decimal" />
      </label>
      <label class="fld">
        <span class="fld-k">Stop loss</span>
        <input class="fld-i" id="sl" type="number" min="0" step="1" value="1000" inputmode="decimal" />
      </label>

      <div class="run-actions">
        <button class="btn btn--violet btn--lg" id="start" type="button">Start</button>
        <button class="btn btn--lg" id="stop" type="button" disabled>Stop</button>
      </div>

      <p class="risk" id="risk"></p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <!-- ── live state ───────────────────────────────────────────────── -->
    <section class="panel-solid">
      <h2 class="grp-t">Session</h2>

      <!-- Each figure carries its own colour, so the six read as six
           different things at a glance rather than one grey block. Flat
           colours from the palette the rest of the app uses. -->
      <dl class="stats-grid">
        <div><dt>Profit</dt><dd id="s-profit">0.00</dd></div>
        <div><dt>Trades</dt><dd class="stat--count" id="s-trades">0</dd></div>
        <div><dt>Win rate</dt><dd class="stat--rate" id="s-rate">0.00%</dd></div>
        <div><dt>Next stake</dt><dd class="stat--stake" id="s-stake">&mdash;</dd></div>
        <div><dt>Market</dt><dd class="stat--market" id="s-market">&mdash;</dd></div>
        <div><dt>Running</dt><dd class="stat--time" id="s-time">00:00:00</dd></div>
      </dl>

      <h3 class="grp-t grp-t--sub">Trades</h3>
      <ul class="hist" id="hist"><li class="acct acct--none">No trades yet.</li></ul>
    </section>

  </div>
  <footer class="app-foot">
    <p class="disclaimer">Trading carries risk. This is an automated tool, not financial advice or a profit guarantee. Never risk more than you can afford to lose.</p>
  </footer>

</main>

<script src="/alert/alert.js"></script>
<script src="/deriv.js"></script>
<script src="/currency.js"></script>
<script src="/prefs.js"></script>
<script src="/automatic-ai-engine.js"></script>
<script src="/unlock.js"></script>
<script src="/automatic-ai.js"></script>
<script src="/theme.js"></script>
</body>
</html>
